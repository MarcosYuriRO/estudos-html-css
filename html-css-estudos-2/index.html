<!DOCTYPE html>
<html lang='pt-BR
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Painel de Estoque</title>
    <link rel='stylesheet' href='style.css'>
</head>
<body>
    <header>
        <h1>Painel de Estoque</h1>
    </header>
    <main>
        <h2>Formulário</h2>
        
        <fieldset>
            <legend>Dados do Produto</legend>

            <div>
                <label for="nome">Nome do Produto:</label>
                <input type="text" id="nome" name="nome_produto" placeholder="Ex: Grampeador" required maxlength="50">
            </div>

            <div>
                <label for="preco">Preço (R$):</label>
                <input type="number" id="preco" name="preco_produto" placeholder="Ex: 8.99" step="0.01">
            </div>

            <div>
                <label for="categoria">Categoria:</label>
                <select name="categoria_produto" id="categoria">
                    <option value="" disabled selected>Selecione uma opção...</option>
                    <option value="1">Alimentos</option>
                    <option value="2">Eletrônicos</option>
                    <option value="3">Domésticos</option>
                    <option value="4">Variados</option>
                </select>
            </div>

            <div>
                <p>Status do Item:</p>
                <input type="radio" id="ativo" name="status" value="ativo" checked>
                <label for="ativo">Ativo</label>

                <input type="radio" id="inativo" name="status" value="inativo">
                <label for="inativo">Inativo</label>
            </div>

        </fieldset>

        <button type="submit">Cadastrar Produto</button>
    </main>
    <footer>
        <p>Sistema de Gestão v1.0</p>
    </footer>
</body>
</html>
